syntax = "proto3";
package defguard.client.v1;

import "common/device_identity.proto";
import "enterprise/v2/posture/posture.proto";
import "google/protobuf/empty.proto";

message InterfaceConfig {
  string name = 1;
  string prvkey = 2;
  string address = 3;
  uint32 port = 4;
  repeated Peer peers = 5;
  optional uint32 mtu = 6;
}

message Peer {
  string public_key = 1;
  optional string preshared_key = 2;
  optional uint32 protocol_version = 3;
  optional string endpoint = 4;
  optional uint64 last_handshake = 5;
  uint64 tx_bytes = 6;
  uint64 rx_bytes = 7;
  optional uint32 persistent_keepalive_interval = 8;
  repeated string allowed_ips = 9;
}

message CreateInterfaceRequest {
  InterfaceConfig config = 1;
  optional string dns = 3;
}

message RemoveInterfaceRequest {
  string interface_name = 2;
  string endpoint = 6;
}

message ReadInterfaceDataRequest {
  string interface_name = 2;
}

message InterfaceData {
  uint32 listen_port = 1;
  repeated Peer peers = 2;
}

enum ServiceLocationMode {
  PRE_LOGON = 0;
  ALWAYS_ON = 1;
}

message ServiceLocation {
  string name = 1;
  string address = 2;
  string pubkey = 3;
  string endpoint = 4;
  string allowed_ips = 5;
  uint32 keepalive_interval = 6;
  string dns = 7;
  ServiceLocationMode mode = 8;
  int64 core_location_id = 9;
  bool posture_check_required = 10;
}

message SaveServiceLocationsRequest {
  repeated ServiceLocation service_locations = 1;
  string instance_id = 2;
  string private_key = 3;
  string proxy_url = 4;
  string device_pubkey = 5;
  // Device polling token
  optional string token = 6;
}

message DeleteServiceLocationsRequest {
  string instance_id = 1;
}

message StopServiceLocationRequest {
  string instance_id = 1;
  string pubkey = 2;
}

message ManagedInterfaceData {
  string interface_name = 1;
  InterfaceData data = 2;
}

message ListInterfacesResponse {
  repeated ManagedInterfaceData interfaces = 1;
}

message DeviceIdentityMaterial {
  oneof backend {
    TpmIdentityMaterial tpm = 1;
  }
}

message TpmIdentityMaterial {
  TpmEndorsementKeyMaterial ek = 1;
  // Input TPMT_PUBLIC used to recreate the original parent with CreatePrimary.
  bytes srk_template = 2;
  TpmKeyBlobs ak = 3;
  TpmKeyBlobs identity_key = 4;
}

message TpmEndorsementKeyMaterial {
  // Input TPMT_PUBLIC used to recreate the EK for credential activation.
  bytes template = 1;
  // Marshalled TPMT_PUBLIC, without an outer TPM2B size field.
  bytes public = 2;
  // Leaf first, possibly empty or incomplete.
  repeated bytes certificate_chain_der = 3;
}

message TpmKeyBlobs {
  // Marshalled TPMT_PUBLIC, without an outer TPM2B size field.
  bytes public = 1;
  // Parent-protected TPM2B_PRIVATE contents, without the outer size field.
  bytes private = 2;
}

message CreateDeviceIdentityResponse {
  // Caller-owned material for local persistence, never sent to Core.
  DeviceIdentityMaterial identity = 1;
  defguard.device_identity.v2.AttestationIdentity attestation_identity = 2;
}

message AttestDeviceIdentityRequest {
  // Supplied by the caller, the daemon keeps no persistent identity store.
  DeviceIdentityMaterial identity = 1;
  defguard.device_identity.v2.AttestationChallenge challenge = 2;
}

// service used by desktop clients to communicate with interface management
// daemon
service DesktopDaemonService {
  rpc CreateInterface(CreateInterfaceRequest) returns (google.protobuf.Empty);
  rpc RemoveInterface(RemoveInterfaceRequest) returns (google.protobuf.Empty);
  rpc ReadInterfaceData(ReadInterfaceDataRequest) returns (stream InterfaceData);
  rpc SaveServiceLocations(SaveServiceLocationsRequest) returns (google.protobuf.Empty);
  rpc DeleteServiceLocations(DeleteServiceLocationsRequest) returns (google.protobuf.Empty);
  rpc GetPostureData(google.protobuf.Empty) returns (defguard.enterprise.posture.v2.DevicePostureData);
  rpc ListInterfaces(google.protobuf.Empty) returns (ListInterfacesResponse);
  rpc CreateDeviceIdentity(google.protobuf.Empty) returns (CreateDeviceIdentityResponse);
  rpc AttestDeviceIdentity(AttestDeviceIdentityRequest) returns (defguard.device_identity.v2.AttestationChallengeSolution);
}
