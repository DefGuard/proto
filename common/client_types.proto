syntax = "proto3";
package defguard.client_types;

import "enterprise/v2/posture/posture.proto";

/*
 * Shared message and enum definitions used by Defguard desktop clients (desktop app and CLI).
 *
 * This module exists to decouple the desktop client from any specific proxy protocol version.
 * The client only needs a stable, version-independent set of types for:
 *   - Enrollment and device configuration (DeviceConfigResponse and its dependencies)
 *   - Periodic configuration polling (InstanceInfoRequest/Response)
 *   - Platform info reporting (ClientPlatformInfo)
 *
 * Both v1 and v2 proxy protocol definitions import this file and reference these types in
 * their CoreRequest/CoreResponse envelopes, ensuring that a single client build can
 * communicate with proxies running either protocol version without any code changes.
 *
 * Types that are proxy-version-specific (e.g. gRPC envelope messages, setup/certificate
 * provisioning, password reset flows) are intentionally NOT included here.
 */

// Enrollment & Desktop Client activation

message EnrollmentStartRequest {
  string token = 1;
}

message AdminInfo {
  string name = 1;
  optional string phone_number = 2;
  string email = 3;
}

message InitialUserInfo {
  string first_name = 1;
  string last_name = 2;
  string login = 3;
  string email = 4;
  optional string phone_number = 5;
  bool is_active = 6;
  repeated string device_names = 7;
  bool enrolled = 8;
  bool is_admin = 9;
  // When true, this user is managed by an external identity provider (LDAP/AD/OIDC)
  // whose administrator disabled local password management. The client must not prompt
  // for local password creation during enrollment, and the password reset option must
  // be hidden. Defaults to false for local users.
  bool password_management_disabled = 10;
}

message EnrollmentSettings {
  // Vpn step is skippable
  bool vpn_setup_optional = 1;
  // Manual WireGuard setup is disabled
  bool only_client_activation = 2;
  // Only admins can add devices so vpn step is skipped
  bool admin_device_management = 3;
  // Enable Email method for MFA setup
  bool smtp_configured = 4;
  // MFA setup is not skippable
  bool mfa_required = 5;
}

message EnrollmentStartResponse {
  AdminInfo admin = 1;
  InitialUserInfo user = 2;
  int64 deadline_timestamp = 3;
  string final_page_content = 5;
  InstanceInfo instance = 7;
  EnrollmentSettings settings = 8;
}

message ActivateUserRequest {
  optional string phone_number = 1;
  // Omitted for externally-managed users whose provider disabled local password
  // management (see InitialUserInfo.password_management_disabled). Core must not call
  // set_password when this is absent.
  optional string password = 2;
  optional string token = 3;
}

message NewDevice {
  string name = 1;
  string pubkey = 2;
  optional string token = 3;
}

message ExistingDevice {
  string pubkey = 1;
  optional string token = 2;
}

message Device {
  int64 id = 1;
  string name = 2;
  string pubkey = 3;
  int64 user_id = 4;
  int64 created_at = 5;
}

// Device configuration

enum LocationMfaMode {
  LOCATION_MFA_MODE_UNSPECIFIED = 0;
  LOCATION_MFA_MODE_DISABLED = 1;
  LOCATION_MFA_MODE_INTERNAL = 2;
  LOCATION_MFA_MODE_EXTERNAL = 3;
}

enum ServiceLocationMode {
  SERVICE_LOCATION_MODE_UNSPECIFIED = 0;
  SERVICE_LOCATION_MODE_DISABLED = 1;
  SERVICE_LOCATION_MODE_PRELOGON = 2;
  SERVICE_LOCATION_MODE_ALWAYSON = 3;
}

message DeviceConfig {
  int64 network_id = 1;
  string network_name = 2;
  string config = 3;
  string endpoint = 4;
  string assigned_ip = 5;
  // network pubkey
  string pubkey = 6;
  string allowed_ips = 7;
  optional string dns = 8;
  // DEPRECATED(1.5): superseded by location_mfa_mode
  bool mfa_enabled = 9 [deprecated = true];
  int32 keepalive_interval = 10;
  // DEPRECATED(2.2): superseded by steps (field 14).
  // Populated server-side only for backward-compatible locations
  // (single-flow, single-step, full method set).
  // Omitted (along with the location) when incompatible.
  optional LocationMfaMode location_mfa_mode = 11 [deprecated = true];
  optional ServiceLocationMode service_location_mode = 12;
  // added for 2.1
  optional bool posture_check_required = 13;
  // [2.2] Resolved MFA flow for this location+user.
  // The server resolves group membership at config-build time and delivers
  // a single effective MfaStep list per location. Every MfaStepMethod.configured
  // already reflects whether THIS user has that method set up — no intersection
  // with InstanceInfo.mfa_user_state is needed.
  repeated MfaStep steps = 14;
}

enum ClientTrafficPolicy {
  NONE = 0;
  DISABLE_ALL_TRAFFIC = 1;
  FORCE_ALL_TRAFFIC = 2;
}

message InstanceInfo {
  string id = 1;
  string name = 2;
  string url = 3;
  string proxy_url = 4;
  string username = 5;
  bool enterprise_enabled = 6;
  // DEPRECATED(1.6): superseded by client_traffic_policy
  bool disable_all_traffic = 7 [deprecated = true];
  optional string openid_display_name = 8;
  optional ClientTrafficPolicy client_traffic_policy = 9;
  // Added for 2.1
  // When ANY enrolled instance has this true, the desktop
  // client and CLI hide, block, and disconnect bare WireGuard tunnels
  // (OR-across-instances semantics).
  optional bool disable_tunnels = 10;
  // [2.2] Lightweight summary of the enrolled user's configured MFA methods.
  // Used for quick checks (e.g. "does this user have any MFA methods?").
  // The client does NOT intersect this with DeviceConfig.steps — the resolved
  // flow in DeviceConfig already carries per-user configured flags.
  MfaUserState mfa_user_state = 11;
}

message DeviceConfigResponse {
  Device device = 1;
  repeated DeviceConfig configs = 2;
  InstanceInfo instance = 3;
  // polling token used for further client-core communication
  optional string token = 4;
}

// Configuration polling

message InstanceInfoRequest {
  string token = 1;
}

message InstanceInfoResponse {
  DeviceConfigResponse device_config = 1;
}

// Platform info sent as a header with every request to the proxy

message ClientPlatformInfo {
  string os_family = 1;
  string os_type = 2;
  string version = 3;
  optional string edition = 4;
  optional string codename = 5;
  optional string bitness = 6;
  optional string architecture = 7;
}

// Client MFA

enum MfaMethod {
  TOTP = 0;
  EMAIL = 1;
  OIDC = 2;
  BIOMETRIC = 3;
  MOBILE_APPROVE = 4;
}

message ClientMfaStartRequest {
  int64 location_id = 1;
  string pubkey = 2;
  // Legacy single-step path: set on its own to trigger the fused Start +
  // StepStart adapter for pre-2.2.0 clients. Must not be set together with
  // selected_methods.
  optional MfaMethod method = 3;
  // [2.1] Required when the location has posture policies assigned.
  optional defguard.enterprise.posture.v2.DevicePostureData posture_data = 4;
  // [2.2] Multi-step path: the client's full per-step method plan, one entry
  // per step in flow order — index i is the chosen method for step i.
  // Must contain exactly one entry per step; a mismatched length is rejected
  // with WRONG_PLAN_LENGTH. Non-empty triggers the multi-step Start flow.
  repeated MfaMethod selected_methods = 5;
}

message ClientMfaStartResponse {
  string token = 1;
  // for biometric mfa method (legacy fused path only)
  optional string challenge = 2;
  // [2.2] The flow descriptor with per-user configured annotations set.
  // Returned on success as a safety net for stale DeviceConfig.
  repeated MfaStep steps = 3;
  // [2.2] Structured rejection list. Non-empty on failure; the client
  // maps rejections to picker steps by MfaStepRejection.step.
  repeated MfaStepRejection rejections = 4;
}

message ClientMfaFinishRequest {
  string token = 1;
  optional string code = 2;
  optional string auth_pub_key = 3;
}

message ClientMfaFinishResponse {
  string preshared_key = 1 [deprecated = true];
  optional string token = 2;
  // [2.2] Per-step result — either MfaAdvanced (proceed to next_step)
  // or MfaCompleted (flow done, preshared_key inside).
  MfaStepResult result = 3;
}

message RegisterMobileAuthRequest {
  string token = 1;
  string auth_pub_key = 2;
  string device_pub_key = 3;
}

// TOTP and Email MFA Setup

message CodeMfaSetupStartRequest {
  MfaMethod method = 1;
  string token = 2;
}

// in case of email secret is empty
message CodeMfaSetupStartResponse {
  optional string totp_secret = 1;
}

message CodeMfaSetupFinishRequest {
  string code = 1;
  string token = 2;
  MfaMethod method = 3;
}

message CodeMfaSetupFinishResponse {
  repeated string recovery_codes = 1;
}

// Multi-step MFA (added for 2.2)

message MfaStepMethod {
  MfaMethod method = 1;
  // Per-user configured status, set server-side.
  // On DeviceConfig.steps: the server resolves per-user state at config-build
  // time — the client uses it directly.
  // On ClientMfaStartResponse.steps: returned as a safety net for stale
  // DeviceConfig; the flow shape is authoritative.
  bool configured = 2;
}

message MfaStep {
  // Positionally addressed throughout the client proto: a step is identified by
  // its index in the ordered list it appears in. No server-side row id crosses
  // the wire, and the client never reasons about flow identity.
  repeated MfaStepMethod methods = 1;
}

message MfaUserState {
  // Lightweight summary: the set of MFA methods this user can currently use
  // on this device. For quick checks (e.g. "does this user have any MFA
  // methods at all?").
  repeated MfaMethod configured_methods = 1;
}

enum MfaStartRejectionReason {
  WRONG_PLAN_LENGTH = 0;
  METHOD_NOT_IN_STEP = 1;
  METHOD_NOT_CONFIGURED = 2;
  STEP_EMPTY_AFTER_LICENSE = 3;
  STEP_NO_CONFIGURED_METHODS = 4;
}

// Sparse: only failing steps are returned, so the step index is carried
// explicitly here (unlike the request plan, which is positional).
message MfaStepRejection {
  uint32 step = 1;
  MfaStartRejectionReason reason = 2;
}

message MfaAdvanced {
  uint32 next_step = 1;
}

message MfaCompleted {
  string preshared_key = 1;
}

message MfaStepResult {
  oneof outcome {
    MfaAdvanced advanced = 1;
    MfaCompleted completed = 2;
  }
}

message ClientMfaStepStartRequest {
  string token = 1;
  MfaMethod method = 2;
}

message ClientMfaStepStartResponse {
  string step_attempt_id = 1;
  optional string challenge = 2;
}

// External OIDC authentication flow
enum AuthFlowType {
  AUTH_FLOW_TYPE_UNSPECIFIED = 0;
  AUTH_FLOW_TYPE_ENROLLMENT = 1;
  AUTH_FLOW_TYPE_MFA = 2;
}

message AuthInfoRequest {
  // DEPRECATED(2.0): superseded by auth_flow_type; kept for legacy client compatibility
  string redirect_url = 1 [deprecated = true];
  optional string state = 2;
  AuthFlowType auth_flow_type = 3;
}
